name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    # Linux is the intended host; Windows (the operator's PC, Python 3.12) is checked so "it runs on Windows" is
    # a fact, not a guess. A failure on one OS must not hide the result on the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # api/llm extras pull in fastapi+httpx (used by TestClient in
          # tests/unit/test_status_api.py) and the anthropic/openai SDKs
          # (tests inject fake clients — no network or API key needed).
          pip install -e '.[dev,api,llm]'

      - name: Run tests
        run: python -m pytest
