<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>運用ダッシュボード</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #e5e7eb; --text: #14213d; --muted: #6b7280;
    --green: #16a34a; --red: #dc2626; --amber: #d97706; --blue: #2563eb;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text);
         font: 16px/1.7 -apple-system, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
         padding: 16px 16px 48px; max-width: 900px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  h1 { font-size: 17px; font-weight: 600; }
  .toggle { display: inline-flex; background: #e6ebf2; border-radius: 999px; padding: 3px; }
  .toggle button { border: 0; background: none; padding: 6px 18px; border-radius: 999px; font: inherit; font-size: 14px; color: var(--muted); cursor: pointer; }
  .toggle button.on { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .badge { display: inline-block; padding: 1px 10px; border-radius: 6px; font-weight: 700; font-size: 12px; background: #e6ebf2; color: var(--muted); }
  .badge.live { background: #fee2e2; color: var(--red); }
  .hero { border-radius: 20px; padding: 26px 26px 22px; color: #fff; margin-bottom: 14px; }
  .hero.ok { background: linear-gradient(135deg, #16a34a, #22c55e); }
  .hero.warn { background: linear-gradient(135deg, #d97706, #f59e0b); }
  .hero.bad { background: linear-gradient(135deg, #dc2626, #ef4444); }
  .hero.ok, .hero.warn, .hero.bad { color: #fff; }
  .hero .w { font-size: 13px; letter-spacing: .2em; opacity: .9; }
  .hero h2 { font-size: 27px; line-height: 1.4; margin: 4px 0 6px; font-weight: 700; }
  .hero p { opacity: .96; overflow-wrap: anywhere; }
  .alerts { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 14px; padding: 12px 18px; margin-bottom: 14px; }
  .alerts.bad { background: #fef2f2; border-color: #fecaca; }
  .alerts b { display: block; margin-bottom: 2px; }
  .alerts li { margin-left: 1.2em; font-size: 14px; overflow-wrap: anywhere; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; min-width: 0; }
  .tile .l { color: var(--muted); font-size: 13px; }
  .tile .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .tile .s { color: var(--muted); font-size: 12px; line-height: 1.4; }
  section, .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; margin-bottom: 14px; }
  section h2, .card h2 { font-size: 15px; margin-bottom: 8px; font-weight: 700; }
  h3 { font-size: 13px; color: var(--muted); margin: 12px 0 4px; font-weight: 600; }
  .pos { color: var(--green); } .neg { color: var(--red); } .warn { color: var(--amber); } .muted { color: var(--muted); }
  .note { color: var(--muted); font-size: 13px; }
  .bar { height: 10px; background: #e5e7eb; border-radius: 6px; overflow: hidden; margin: 8px 0 4px; }
  .bar i { display: block; height: 100%; background: var(--blue); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
  .chip { background: #eef2ff; color: #3730a3; border-radius: 999px; padding: 2px 12px; font-size: 14px; }
  .chip.grey { background: #f3f4f6; color: #374151; }
  canvas { width: 100%; height: 150px; display: block; }
  /* holdings: a grid of tappable boxes */
  .hold-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .hold-total { font-size: 14px; }
  .boxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; }
  .box { all: unset; box-sizing: border-box; cursor: pointer; background: #fff; border: 1px solid var(--border); border-radius: 14px;
         padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; position: relative; }
  .box:hover { border-color: #c7d2fe; } .box:focus-visible { outline: 2px solid var(--blue); }
  .box.up { border-top: 4px solid var(--green); } .box.down { border-top: 4px solid var(--red); } .box.flat { border-top: 4px solid #d1d5db; }
  .box .sym { font-weight: 800; font-size: 17px; line-height: 1.2; }
  .box .co { font-size: 12px; color: var(--muted); line-height: 1.3; overflow-wrap: anywhere; }
  .box .cat { display: inline-block; align-self: flex-start; background: #eef2ff; color: #3730a3; border-radius: 999px; padding: 0 8px; font-size: 11px; margin: 2px 0 4px; }
  .box .pct { font-size: 24px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .box .amt { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .box .sub { color: var(--muted); font-size: 11.5px; line-height: 1.35; }
  .box .why1 { margin-top: 4px; font-size: 11.5px; color: #92400e; background: #fffbeb; border-radius: 8px; padding: 2px 8px; line-height: 1.35; }
  .more-link { all: unset; cursor: pointer; display: inline-block; margin-top: 12px; color: var(--blue); font-size: 15px; font-weight: 600; }
  .more-link:focus-visible { outline: 2px solid var(--blue); border-radius: 6px; }
  .back { all: unset; cursor: pointer; color: var(--blue); font-size: 15px; font-weight: 600; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0 12px; }
  .controls select { font: inherit; font-size: 14px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border); background: #fff; }
  .fchip { all: unset; cursor: pointer; padding: 2px 12px; border-radius: 999px; background: #f3f4f6; color: #374151; font-size: 13px; }
  .fchip.on { background: #3730a3; color: #fff; }
  .fchip:focus-visible { outline: 2px solid var(--blue); }
  body.all #viewHome, body.all .toggle { display: none; } #viewAll { display: none; } body.all #viewAll { display: block; }
  /* detail sheet for one symbol */
  .sheet-bg { position: fixed; inset: 0; background: rgba(20,33,61,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet { background: #fff; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 18px 20px 24px; }
  @media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 20px; } }
  .sheet-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .sheet-top .x { all: unset; cursor: pointer; font-size: 26px; line-height: 1; color: var(--muted); padding: 0 6px; }
  .sheet .big { font-size: 28px; font-weight: 800; }
  .why h4 { font-size: 12px; color: var(--muted); margin: 14px 0 2px; font-weight: 600; letter-spacing: .04em; }
  .why p { overflow-wrap: anywhere; font-size: 15px; }
  .why .plan { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 4px; }
  .why .plan div { background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; }
  .why .plan b { display: block; font-size: 16px; }
  .why .plan span { color: var(--muted); font-size: 12px; }
  details { margin: 4px 0; } summary { cursor: pointer; color: var(--blue); font-size: 14px; }
  ul.plain { list-style: none; padding: 0; }
  ul.plain li { padding: 3px 0; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  /* くわしい view */
  .detail { display: none; } body.full .detail { display: block; } body.full .only-simple { display: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .grid .card { margin-bottom: 0; padding: 10px 14px; border-radius: 12px; }
  .grid .card .label { color: var(--muted); font-size: 12px; }
  .grid .card .value { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
  .grid .card .sub { color: var(--muted); font-size: 11px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  th:first-child, td:first-child, td.l, th.l { text-align: left; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .scroll table { min-width: 520px; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .cols section { margin-bottom: 0; min-width: 0; }
  .cols .scroll table { min-width: 0; }
  .cols th, .cols td { white-space: normal; overflow-wrap: anywhere; }
  .banner { border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; font-size: 13px; }
  .banner.WARNING { background: #fff7ed; border: 1px solid #fed7aa; color: var(--amber); }
  .banner.CRITICAL { background: #fef2f2; border: 1px solid #fecaca; color: var(--red); }
  .banner.info { background: #eff6ff; border: 1px solid #bfdbfe; color: var(--blue); }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; color: var(--muted); }
  #error { display: none; }
  footer { color: var(--muted); font-size: 12px; margin-top: 8px; }
  @media (max-width: 600px) {
    .tiles { grid-template-columns: 1fr 1fr; } .tiles .tile:first-child { grid-column: 1 / -1; }
    .hero h2 { font-size: 22px; }
    .boxes { grid-template-columns: 1fr 1fr; gap: 8px; }
  }
</style>
</head>
<body>
<header>
  <h1>運用ダッシュボード <span id="env" class="badge">…</span></h1>
  <div class="toggle" role="group" aria-label="表示の切り替え"><button id="bSimple" class="on" type="button">かんたん</button><button id="bFull" type="button">くわしい</button></div>
</header>
<div id="error" class="banner CRITICAL"></div>
<div id="viewHome">
<div id="hero"></div>
<div id="findings"></div>
<div class="tiles" id="tiles"></div>

<section><h2>気にしてほしい銘柄</h2><div id="holdings"></div></section>

<div class="card"><h2>資産の推移</h2><canvas id="chart" width="800" height="150"></canvas>
  <div class="note" style="display:flex;justify-content:space-between"><span id="d0"></span><span id="d1"></span></div>
  <div class="bar"><i id="progress" style="width:0"></i></div><div class="note" id="perfWarn"></div></div>

<div class="card"><h2 id="didTitle">直近のセッションでしたこと</h2><div id="did"></div></div>

<div class="detail">
<div class="grid" id="runnerCards"></div>
<section><h2>成績</h2><div class="grid" id="perfCards"></div></section>
<section><h2>セッション（新しい順）</h2><div class="scroll"><table id="sessions"></table></div></section>
<section><h2>最新セッションの詳細</h2><div id="latest"></div></section>
<div class="cols" id="observers"></div>
<section><h2>障害（インシデント）</h2><div id="incidents"></div></section>
<section><h2>人の意図</h2><div id="intents"></div></section>
<section><h2>通知の履歴</h2><div id="alerts"></div></section>
</div>
</div>
<div id="viewAll">
  <button class="back" id="backBtn" type="button">← もどる</button>
  <section><h2 id="allTitle">持っている全ての銘柄</h2><div id="allHead"></div>
    <div class="controls"><label class="note">並べ方 <select id="sortSel">
      <option value="attention">気にしてほしい順</option><option value="pnl_pct">損益％の高い順</option><option value="pnl_pct_asc">損益％の低い順</option>
      <option value="value">評価額の大きい順</option><option value="symbol">ティッカー順</option></select></label>
      <span id="catChips" class="controls" style="margin:0"></span></div>
    <div class="boxes" id="allBoxes"></div></section>
</div>
<div id="sheetHost"></div>
<footer id="footer"></footer>

<script>
"use strict";
const token = new URLSearchParams(location.search).get("token");
const headers = token ? { Authorization: "Bearer " + token } : {};

// All data is rendered through textContent — never as HTML — because it contains text we did not write
// (news-derived reasons, incident descriptions, operator-typed reasons).
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return e;
}
const money = (x) => x == null ? "—" : (x < 0 ? "-$" : "$") + Math.abs(x).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (x, d = 2) => x == null ? "—" : (x * 100).toFixed(d) + "%";
const signed = (x, f) => x == null ? "—" : (x > 0 ? "+" : "") + f(x);
const cls = (x) => x > 0 ? "pos" : x < 0 ? "neg" : "";
const jst = (iso) => iso ? new Date(iso).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", hour12: false }) + " JST" : "—";
const et = (iso) => iso ? new Date(iso).toLocaleString("en-US", { timeZone: "America/New_York", hour12: false }) + " ET" : "—";
const card = (label, value, sub, c) => el("div", { class: "card" }, el("div", { class: "label", text: label }),
  el("div", { class: "value " + (c || ""), text: value }), sub ? el("div", { class: "sub", text: sub }) : null);
function table(head, rows, leftCols = 1) {
  const t = el("table");
  t.append(el("thead", {}, el("tr", {}, head.map((h, i) => el("th", { class: i < leftCols ? "l" : "", text: h })))));
  t.append(el("tbody", {}, rows.map((r) => el("tr", {}, r.map((c, i) => {
    const text = (c && typeof c === "object" && "t" in c) ? c.t : c;
    return el("td", { class: ((c && c.c) || "") + (i < leftCols ? " l" : ""), text: text == null ? "—" : text });
  })))));
  return el("div", { class: "scroll" }, t);
}
function panel(title, ...body) { return el("section", {}, el("h2", { text: title }), body); }
async function get(path) {
  const r = await fetch(path, { headers });
  if (!r.ok) throw new Error(path + " → HTTP " + r.status);
  return r.json();
}
function setChildren(id, ...kids) { const e = document.getElementById(id); e.replaceChildren(...kids.flat(Infinity).filter(Boolean)); }
function errorBox(data) { return data && data.error ? el("div", { class: "banner CRITICAL", text: data.error }) : null; }

function drawChart(series) {
  const cv = document.getElementById("chart"), dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight; cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, w, h);
  const css = getComputedStyle(document.documentElement);
  if (series.length < 2) { g.fillStyle = css.getPropertyValue("--muted"); g.font = "13px sans-serif"; g.fillText("2回以上セッションが終わると表示されます", 4, 24); return; }
  const ys = series.map((s) => s.equity), lo = Math.min(...ys), hi = Math.max(...ys), pad = (hi - lo) * 0.15 || 1;
  const T = 10, B = 6, x = (i) => 6 + (w - 12) * i / (series.length - 1);
  const y = (v) => T + (h - T - B) * (1 - (v - (lo - pad)) / (hi - lo + 2 * pad));
  const blue = css.getPropertyValue("--blue").trim();
  g.beginPath(); series.forEach((s, i) => i ? g.lineTo(x(i), y(s.equity)) : g.moveTo(x(i), y(s.equity)));
  g.lineTo(x(series.length - 1), h - B); g.lineTo(x(0), h - B); g.closePath(); g.fillStyle = blue + "1f"; g.fill();
  g.strokeStyle = blue; g.lineWidth = 2; g.lineJoin = "round"; g.beginPath();
  series.forEach((s, i) => i ? g.lineTo(x(i), y(s.equity)) : g.moveTo(x(i), y(s.equity))); g.stroke();
  g.fillStyle = blue; g.beginPath(); g.arc(x(series.length - 1), y(ys[ys.length - 1]), 4, 0, 7); g.fill();
}

const jstShort = (iso) => iso ? new Date(iso).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false }) : "—";

// One sentence about the system's state, in plain words. Worst case wins; the exact wording of each reason is
// the watchdog's own finding, so nothing is invented here.
function heroOf(s) {
  const r = s.runner, bad = s.findings.filter((f) => f.level === "CRITICAL"), warn = s.findings.filter((f) => f.level === "WARNING");
  if (!r) return { level: "bad", word: "停止", head: "まだ動いていません。", text: "状態ファイルがありません。ランナーを起動してください。" };
  if (s.kill_switch.engaged) return { level: "bad", word: "停止", head: "緊急停止中です。", text: s.kill_switch.operator + ": " + s.kill_switch.reason };
  if (r.state === "FAILED") return { level: "bad", word: "停止", head: "異常で止まっています。", text: r.failure || "原因は障害の履歴を見てください。" };
  if (s.overall === "CRITICAL") return { level: "bad", word: "要確認", head: "確認が必要です。", text: bad.length ? bad[0].message : "くわしい画面を見てください。" };
  if (r.risk_state !== "NORMAL") return { level: "warn", word: "注意",
    head: r.risk_state === "HALT_NEW_ENTRIES" ? "新しい買いを止めています。" : "安全装置が働いています。",
    text: "持っている分の損切りは動いています（状態: " + r.risk_state + "）。" };
  if (s.overall === "WARNING") return { level: "warn", word: "注意", head: "動いていますが、注意があります。", text: warn.length ? warn[0].message : "" };
  return { level: "ok", word: "正常", head: "正常に動いています。", text: r.next_session_at ? "次の取引は " + jstShort(r.next_session_at) + " です。" : "" };
}

function renderStatus(s) {
  const r = s.runner, h = heroOf(s);
  const env = document.getElementById("env");
  env.textContent = r ? r.environment : "—"; env.className = "badge" + (r && r.environment === "LIVE" ? " live" : "");
  setChildren("hero", el("div", { class: "hero " + h.level }, el("div", { class: "w", text: h.word }),
    el("h2", { text: h.head }), h.text ? el("p", { text: h.text }) : null));
  const notes = s.findings.filter((f) => f.level !== "OK");
  setChildren("findings", notes.length ? el("div", { class: "alerts" + (s.overall === "CRITICAL" ? " bad" : "") },
    el("b", { text: "確認してほしいこと" }), el("ul", {}, notes.map((f) => el("li", { text: f.message })))) : null);
  const age = r ? Math.max(0, Math.round((new Date(s.now) - new Date(r.updated_at)) / 1000)) : null;
  const cards = [
    card("ランナー", r ? r.state : "未起動", r ? "心拍 " + age + " 秒前 · pid " + r.pid : "状態ファイルがありません", r && r.state === "FAILED" ? "neg" : ""),
    card("リスク状態", r ? r.risk_state : "—", null, r && r.risk_state !== "NORMAL" ? "warn" : "pos"),
    card("キルスイッチ", s.kill_switch.engaged ? "作動中" : "解除", s.kill_switch.engaged ? s.kill_switch.operator + ": " + s.kill_switch.reason : null, s.kill_switch.engaged ? "neg" : "pos"),
    card("最終セッション", r && r.last_session_date ? r.last_session_date : "—", r ? "実行 " + r.sessions_run + " 回" : null),
    card("口座の保存", s.checkpoint && s.checkpoint.at ? jst(s.checkpoint.at) : "なし", s.checkpoint ? (s.checkpoint.error || s.checkpoint.reason + " · " + s.checkpoint.count + " 世代") : "再起動で引き継げません", s.checkpoint && s.checkpoint.at ? "" : "warn"),
    card("次のセッション", r && r.next_session_at ? jst(r.next_session_at) : "—", r && r.next_session_at ? et(r.next_session_at) : null),
    card("未解決の重大障害", String(s.open_major_incidents.length), s.open_major_incidents.join(", ") || null, s.open_major_incidents.length ? "neg" : "pos"),
  ];
  if (s.live_gate) cards.push(card("LIVE ゲート", s.live_gate.open ? "承認あり" : "閉", null, s.live_gate.open ? "warn" : "neg"));
  setChildren("runnerCards", cards);
}

let lastSeries = [];
const tile = (l, v, sub, c) => el("div", { class: "tile" }, el("div", { class: "l", text: l }), el("div", { class: "v " + (c || ""), text: v }), sub ? el("div", { class: "s", text: sub }) : null);
function renderPerf(p) {
  const s = p.summary, last = (p.series || []).slice(-1)[0];
  setChildren("tiles", errorBox(p), s ? [
    tile("いまの資産", money(s.end_equity), "はじめは " + money(s.start_equity) + "。" + signed(s.end_equity - s.start_equity, money) + "（" + signed(s.total_return, pct) + "）"),
    tile("直近の増減", last ? signed(last.day_pnl, money) : "—", last ? last.date + " のセッション" : null, last ? cls(last.day_pnl) : ""),
    tile("いちばん減った幅", pct(s.max_drawdown), "これまでの高値からの最大の落ち込み", s.max_drawdown > 0.05 ? "warn" : ""),
  ] : el("div", { class: "muted", text: "まだセッションが記録されていません" }));
  document.getElementById("progress").style.width = Math.min(100, 100 * (p.sessions || 0) / (p.proposed_min_sessions || 1)) + "%";
  document.getElementById("perfWarn").textContent = s ? "検証期間 " + p.sessions + " / " + p.proposed_min_sessions + " 営業日。" +
    (p.enough_sessions ? "" : "まだ短いので、増えた・減ったで良し悪しは判断できません。") : "";
  lastSeries = p.series || [];
  document.getElementById("d0").textContent = lastSeries.length ? lastSeries[0].date : "";
  document.getElementById("d1").textContent = lastSeries.length ? lastSeries[lastSeries.length - 1].date : "";
  drawChart(lastSeries);
  setChildren("perfCards", s ? [
    card("資産", money(s.end_equity), "開始 " + money(s.start_equity)),
    card("総リターン", signed(s.total_return, pct), null, cls(s.total_return)),
    card("最大ドローダウン", pct(s.max_drawdown), null, s.max_drawdown > 0.05 ? "warn" : ""),
    card("セッション数", s.sessions + " / " + p.proposed_min_sessions, s.first_date + " 〜 " + s.last_date),
    card("上昇／下落／横ばい", s.up_days + " / " + s.down_days + " / " + s.flat_days, "最良 " + signed(s.best_day, (v) => v.toFixed(2)) + " 最悪 " + signed(s.worst_day, (v) => v.toFixed(2))),
    card("約定／損切り", s.orders_filled + " / " + s.stops_triggered, "手数料 " + money(s.fees_total)),
    card("非 NORMAL で終了", String(s.non_normal_risk_days), "警告あり " + s.warning_days + " 日", s.non_normal_risk_days ? "warn" : ""),
    card("LLM 費用", s.llm_cost_usd == null ? "未記録" : money(s.llm_cost_usd)),
  ] : []);
}

// ---- holdings: boxes. The home page shows the few a human should look at; "all" shows every one; tap = why + plan ----
const qtyText = (q) => Number(q).toLocaleString("en-US", { maximumFractionDigits: 4 });
const dist = (from, to) => from > 0 ? to / from - 1 : null;
let holdData = null, catFilter = null;
function planBox(label, value, sub) { return el("div", {}, el("span", { text: label }), el("b", { text: value }), sub ? el("span", { text: sub }) : null); }

function holdingBox(x) {
  const tone = x.pnl > 0 ? "up" : x.pnl < 0 ? "down" : "flat";
  const b = el("button", { type: "button", class: "box " + tone, "aria-label": x.symbol + " " + (x.company || "") + " の理由と計画を開く" },
    el("div", { class: "sym", text: x.symbol }),
    el("div", { class: "co", text: x.company || "（会社名は未登録）" }),
    x.category ? el("span", { class: "cat", text: x.category }) : null,
    el("div", { class: "pct " + cls(x.pnl), text: signed(x.pnl_pct, pct) }),
    el("div", { class: "amt " + cls(x.pnl), text: signed(x.pnl, money) }),
    el("div", { class: "sub", text: "評価額 " + money(x.value) + " · 資産の " + pct(x.weight, 0) }),
    x.attention_reasons.length ? el("div", { class: "why1", text: x.attention_reasons[0] }) : null);
  b.addEventListener("click", () => openSheet(x));
  return b;
}

function openSheet(x) {
  const close = () => { setChildren("sheetHost"); document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  const pl = x.plan, why = el("div", { class: "why" });
  if (!pl) why.append(el("p", { class: "warn", text: "この銘柄の計画の記録がありません。" }));
  else why.append(
    el("h4", { text: "なぜ持っているか" }), el("p", { text: pl.thesis }),
    el("h4", { text: "今後の計画" }),
    el("div", { class: "plan" },
      planBox("損切りライン", money(pl.stop_price), "いまから " + signed(dist(x.price, pl.stop_price), pct)),
      planBox("利益の目標", money(pl.profit_target), "いまから " + signed(dist(x.price, pl.profit_target), pct)),
      planBox("保有の目安", pl.holding_horizon),
      planBox("最悪の損失（目安）", money(pl.risk_amount), "損切りに達した場合")),
    el("h4", { text: "やめる条件" }), el("p", { text: pl.invalidation }),
    el("h4", { text: "損切りラインの根拠" }), el("p", { text: pl.stop_reason }),
    el("p", { class: "note", style: "margin-top:10px", text: "損切りは取引所に置いた注文で自動的に働きます。計画は買う前に作られたものです。" }));
  const closeBtn = el("button", { class: "x", type: "button", "aria-label": "閉じる", text: "×" });
  closeBtn.addEventListener("click", close);
  const bg = el("div", { class: "sheet-bg" }, el("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": x.symbol },
    el("div", { class: "sheet-top" },
      el("div", {}, el("div", { class: "sym big", text: x.symbol }), el("div", { class: "co", text: (x.company || "") + (x.category ? " · " + x.category : "") })),
      closeBtn),
    el("div", { style: "margin:8px 0 2px" }, el("span", { class: "big " + cls(x.pnl), text: signed(x.pnl_pct, pct) }), "  ", el("b", { class: cls(x.pnl), text: signed(x.pnl, money) })),
    el("div", { class: "note", text: qtyText(x.qty) + " 株 · 買値 " + money(x.avg_cost) + " → いま " + money(x.price) + " · 評価額 " + money(x.value) + " · 資産の " + pct(x.weight, 0) }),
    x.attention_reasons.length ? el("div", { class: "why1", style: "margin-top:8px;display:inline-block", text: x.attention_reasons.join(" / ") }) : null,
    why));
  bg.addEventListener("click", (e) => { if (e.target === bg) close(); });
  setChildren("sheetHost", bg); closeBtn.focus();
}

const holdMsg = (id, text, c) => setChildren(id, el("div", { class: c || "muted", text }));
function renderHoldings(h) {
  holdData = h;
  if (h.error) { setChildren("holdings", errorBox(h)); return renderAll(); }
  if (!h.session_date) return holdMsg("holdings", "まだセッションがありません。");
  if (!h.recorded) return holdMsg("holdings", h.session_date + " のセッションは、銘柄ごとの記録が残る前のものです。次のセッションから表示されます。");
  const byS = new Map(h.holdings.map((x) => [x.symbol, x]));
  const picks = h.attention.map((k) => byS.get(k)).filter(Boolean);
  if (!h.holdings.length) return holdMsg("holdings", "いまは何も持っていません（現金 " + money(h.cash) + "）。");
  const pnl = h.holdings.reduce((t, x) => t + x.pnl, 0), cost = h.holdings.reduce((t, x) => t + x.qty * x.avg_cost, 0);
  const more = el("button", { class: "more-link", type: "button", text: "持っている全ての銘柄を見る（" + h.holdings.length + "）→" });
  more.addEventListener("click", () => { location.hash = "all"; });
  setChildren("holdings",
    el("div", { class: "hold-head" },
      el("div", { class: "hold-total" }, "全 " + h.holdings.length + " 銘柄の合計 ", el("b", { class: cls(pnl), text: signed(pnl, money) + "（" + signed(cost > 0 ? pnl / cost : 0, pct) + "）" })),
      el("div", { class: "note", text: "現金 " + money(h.cash) })),
    el("div", { class: "note", style: "margin-bottom:8px", text: "損切りに近い・大きく動いた・割合が大きい順に最大 " + picks.length + " 件。タップで理由と計画。" }),
    el("div", { class: "boxes" }, picks.map(holdingBox)), more,
    el("div", { class: "note", style: "margin-top:8px", text: h.session_date + " のセッション時点の値です（リアルタイムではありません）。" }));
  renderAll();
}

function renderAll() {
  const h = holdData;
  if (!h || !h.recorded) return setChildren("allBoxes");
  const sort = document.getElementById("sortSel").value;
  const cats = [...new Set(h.holdings.map((x) => x.category || "未分類"))].sort();
  const chip = (label, val) => { const c = el("button", { class: "fchip" + (catFilter === val ? " on" : ""), type: "button", text: label });
    c.addEventListener("click", () => { catFilter = val; renderAll(); }); return c; };
  setChildren("catChips", chip("すべて", null), cats.map((c) => chip(c, c)));
  let items = h.holdings.filter((x) => catFilter === null || (x.category || "未分類") === catFilter);
  const cmp = { attention: (a, b) => b.attention_score - a.attention_score || Math.abs(b.pnl_pct) - Math.abs(a.pnl_pct),
    pnl_pct: (a, b) => b.pnl_pct - a.pnl_pct, pnl_pct_asc: (a, b) => a.pnl_pct - b.pnl_pct,
    value: (a, b) => b.value - a.value, symbol: (a, b) => a.symbol.localeCompare(b.symbol) }[sort];
  items = [...items].sort(cmp);
  const pnl = items.reduce((t, x) => t + x.pnl, 0);
  setChildren("allHead", el("div", { class: "note", text: items.length + " 銘柄 · 合計 " + signed(pnl, money) + " · " + h.session_date + " のセッション時点" }));
  setChildren("allBoxes", items.map(holdingBox));
}

function route() {
  const all = location.hash === "#all";
  document.body.classList.toggle("all", all);
  if (all) window.scrollTo(0, 0);
  if (location.hash === "#full") setFull(true);
}
document.getElementById("backBtn").addEventListener("click", () => { location.hash = ""; });
document.getElementById("sortSel").addEventListener("change", renderAll);
window.addEventListener("hashchange", route);

function renderDid(o, sessions) {
  const last = (sessions.sessions || [])[0];
  document.getElementById("didTitle").textContent = (o.session_date || "直近") + " にしたこと";
  if (!o.session_date) return setChildren("did", el("div", { class: "muted", text: "まだありません" }));
  const fills = o.fills || [], reasons = o.no_trade_reasons || [];
  setChildren("did", errorBox(o),
    el("div", { class: "chips" },
      fills.map((f) => el("span", { class: "chip", text: (f.side === "BUY" ? "買い " : "売り ") + f.symbol })),
      last && last.stops_triggered ? el("span", { class: "chip", text: "損切り " + last.stops_triggered + " 件" }) : null,
      el("span", { class: "chip grey", text: "見送り " + reasons.length + (reasons.length >= 10 ? " 件以上" : " 件") })),
    reasons.length ? el("details", {}, el("summary", { text: "見送った理由を見る" }), el("ul", { class: "plain" }, reasons.map((x) => el("li", { text: x })))) : null,
    (o.data_warnings || []).length ? el("ul", { class: "plain" }, o.data_warnings.map((x) => el("li", { class: "warn", text: x }))) : null);
}

function renderSessions(d) {
  setChildren("sessions", errorBox(d), table(["日付", "資産", "日次損益", "DD", "候補", "約定", "損切り", "保有", "警告", "リスク", "LLM費用"],
    (d.sessions || []).slice(0, 20).map((r) => [r.session_date, money(r.equity), { t: signed(r.day_pnl, (v) => v.toFixed(2)), c: cls(r.day_pnl) },
      pct(r.drawdown), r.candidates, r.orders_filled, r.stops_triggered, r.open_positions, r.data_warnings,
      { t: r.risk_state, c: r.risk_state === "NORMAL" ? "" : "warn" }, r.llm_cost_usd == null ? "—" : money(r.llm_cost_usd)])));
}

function renderObservers(o) {
  const O = o.observers || {}, parts = [];
  setChildren("latest", errorBox(o), o.session_date ? [
    el("div", { class: "muted", text: "セッション " + o.session_date }),
    el("h3", { text: "見送り・除外の理由（上位10）" }),
    el("ul", { class: "plain" }, (o.no_trade_reasons || []).slice(0, 10).map((x) => el("li", { text: x }))),
    (o.data_warnings || []).length ? [el("h3", { text: "データ警告" }), el("ul", { class: "plain" }, o.data_warnings.map((x) => el("li", { class: "warn", text: x })))] : null,
    el("h3", { text: "約定" }),
    (o.fills || []).length ? table(["銘柄", "売買", "数量", "価格"], o.fills.map((f) => [f.symbol, f.side, f.qty, f.price])) : el("div", { class: "muted", text: "なし" }),
    Object.keys(o.disagreement_multipliers || {}).length ? [el("h3", { text: "モデル不一致によるサイズ係数（1.0=縮小なし）" }),
      table(["銘柄", "係数"], Object.entries(o.disagreement_multipliers).map(([k, v]) => [k, { t: v.toFixed(3), c: v < 0.9 ? "warn" : "" }]))] : null,
  ] : el("div", { class: "muted", text: "まだありません" }));

  if (O.forecast) { const f = O.forecast, cal = f.calibration || {};
    parts.push(panel("予測の較正（§32）", el("div", { class: "muted", text: "記録 " + f.recorded + " · 採点済み " + f.resolved + " · 待ち " + f.pending + " · 採点不能 " + f.skipped }),
      Object.keys(cal).length ? table(["シナリオ", "予測確率", "実現頻度", "差"], ["bear", "base", "bull"].map((k) => [k, pct(cal[k].predicted), pct(cal[k].realized), signed(cal[k].gap, (v) => pct(v))])) : el("div", { class: "muted", text: "採点できた予測がまだありません" }))); }
  if (O.shadow) { const s = O.shadow;
    parts.push(panel("シャドー比較（§56-58）", el("div", { class: "muted", text: s.sessions + " セッション" }),
      table(["変種", "累積リターン"], (s.ranking || []).map((r) => [r.variant, { t: pct(r.total_return), c: cls(r.total_return) }])),
      el("div", { text: "AIスタックの寄与（FULL − QUANT_ONLY）: " + (s.ai_stack_contribution == null ? "—" : signed(s.ai_stack_contribution, (v) => pct(v))) }),
      Object.keys(s.alpha_shadow || {}).length ? table(["Alpha", "回数", "平均リターン"], Object.entries(s.alpha_shadow).map(([k, v]) => [k, v.sessions, pct(v.mean_return)])) : null,
      el("ul", { class: "plain" }, (s.caveats || []).map((c) => el("li", { text: c }))))); }
  if (O.attribution) { const a = O.attribution;
    parts.push(panel("損益分解（§54-55）", el("div", { class: "muted", text: "閉じた取引 " + a.closed_trades + " · 未帰属 " + a.unattributed + " · " + a.assumption }),
      table(["項目", "金額"], [["合計", money(a.total_pnl)], ["市場β", money(a.market_beta_pnl)], ["alpha", money(a.alpha_pnl)], ["スリッページ", money(-a.slippage)], ["手数料", money(-a.fees)]]),
      a.profit_quality ? el("div", { text: "利益の質: " + a.profit_quality.source + "（" + a.profit_quality.score + "）— " + a.profit_quality.detail }) : null)); }
  if (O.exit_review) { const e = O.exit_review, st = e.stops || {}, cf = e.counterfactual || {};
    parts.push(panel("出口・見送りの検証（§50-53）",
      el("div", { text: "採点済み損切り " + (st.graded || 0) + " · 良い " + pct(st.good_rate || 0, 0) + " · 早すぎ " + pct(st.early_rate || 0, 0) }),
      el("div", { text: "見送りの追跡 " + cf.tracked + " 件（1週間後の結果あり " + cf.with_1w_outcome + "）· 平均 " + (cf.mean_1w_return_of_skipped == null ? "—" : pct(cf.mean_1w_return_of_skipped)) }),
      (e.proposals || []).length ? table(["提案", "段階"], e.proposals.map((p) => [p.name, p.stage])) : el("div", { class: "muted", text: "出口の研究提案: なし" }))); }
  if (O.daily_review && O.daily_review.grades) { const d = O.daily_review;
    parts.push(panel("日次レビュー（§63-64）", el("div", { text: d.day + " · 損益 " + signed(d.pnl, (v) => v.toFixed(2)) }),
      table(["観点", "評価"], Object.entries(d.grades).map(([k, v]) => [k, v])), el("ul", { class: "plain" }, (d.narrative || []).map((n) => el("li", { text: n }))))); }
  if (O.human_vs_ai) { const h = O.human_vs_ai;
    parts.push(panel("人 vs AI（§79）", el("div", { text: "介入 " + h.overrides + " · 結果が出た " + h.resolved + " · 待ち " + h.pending }),
      el("div", { text: "人の付加価値: " + (h.human_value_added == null ? "—" : h.human_value_added) + "（" + h.unit + "）" }))); }
  if (O.capital_cells) { const c = O.capital_cells, rc = c.reconciliation || {}, latest = rc.latest;
    parts.push(panel("資本セル（案A・観測のみ）",
      el("div", { class: rc.sessions_inconsistent ? "warn" : "pos", text: "照合 " + rc.sessions_checked + " 回 · 不一致 " + rc.sessions_inconsistent + " 回" }),
      latest ? table(["セル", "現金", "評価額", "実現損益"], Object.entries(latest.cells).map(([k, v]) => [k, money(v.cash), money(v.marked_equity), money(v.virtual_realized_pnl)])) : null,
      (c.errors || []).length ? el("ul", { class: "plain" }, c.errors.map((x) => el("li", { class: "warn", text: x }))) : null,
      el("div", { class: "muted", text: "未配分プール " + money(c.unallocated_cash) + " · " + c.note }))); }
  if (O.pit) parts.push(panel("Point-in-Time 記録（§10）", el("div", { text: "判断の入力・出力を記録: " + O.pit.decisions_recorded + " 件" })));
  setChildren("observers", parts.length ? parts : [el("div", { class: "muted", text: "観測者の出力はまだありません" })]);
}

function renderIncidents(d) {
  setChildren("incidents", errorBox(d), (d.incidents || []).length ? table(["ID", "重大度", "状態", "サービス", "内容"],
    d.incidents.map((i) => [i.incident_id, i.severity, { t: i.resolved ? "解決" : "未解決", c: i.resolved ? "" : "neg" }, i.service, i.description]), 1) : el("div", { class: "muted", text: "記録なし" }));
}
function renderIntents(d) {
  setChildren("intents", errorBox(d), (d.intents || []).length ? (d.intents || []).map((i) => el("div", {},
    el("div", {}, el("b", { text: i.intent_id + " " + i.symbol + " " }), el("span", { class: i.status === "CONFIRMED" ? "warn" : "muted", text: i.status }),
      el("span", { class: "muted", text: " · " + i.submitted_by + " · " + i.reason })),

    el("li", { class: a.severity === "CRITICAL" ? "neg" : "warn", text: jst(a.at) + " [" + a.severity + "] " + a.message }))) : el("div", { class: "muted", text: "通知はありません" }));
}

async function refresh() {
  try {
    const [s, p, ss, o, inc, intents, al, hold] = await Promise.all([get("/api/status"), get("/api/performance"), get("/api/sessions?limit=60"),
      get("/api/observers"), get("/api/incidents"), get("/api/intents"), get("/api/alerts?limit=50"), get("/api/holdings")]);
    renderStatus(s); renderPerf(p); renderHoldings(hold); renderDid(o, ss); renderSessions(ss); renderObservers(o); renderIncidents(inc); renderIntents(intents); renderAlerts(al);
    document.getElementById("error").style.display = "none";
    document.getElementById("footer").textContent = "更新 " + jst(s.now) + " · 30秒ごとに自動更新 · 表示のみ（操作は CLI）。数字は直近のセッション時点で、リアルタイムではありません。";
  } catch (e) {
    const b = document.getElementById("error"); b.style.display = "block"; b.textContent = "取得に失敗しました: " + e.message;
  }
}
function setFull(full) {
  document.body.classList.toggle("full", full);
  document.getElementById("bSimple").classList.toggle("on", !full); document.getElementById("bFull").classList.toggle("on", full);
  try { history.replaceState(null, "", full ? "#full" : location.pathname + location.search); } catch (e) { /* a view preference only */ }
}
document.getElementById("bSimple").addEventListener("click", () => setFull(false));
document.getElementById("bFull").addEventListener("click", () => setFull(true));
route();
refresh(); setInterval(refresh, 30000); window.addEventListener("resize", () => drawChart(lastSeries));
