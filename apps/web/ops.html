<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>運用ダッシュボード</title>
<style>
  :root { --bg:#eff1ec; --panel:#f9faf7; --ink:#15201b; --mute:#5a665f; --line:#d5dad2; --acc:#d99a00; --up:#0e7a55; --dn:#c0392b; --flat:#5a665f; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.6 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif; padding-bottom: 72px; }
  .num, .tile .v, .box-pct, .pl, .g .l, .tl { font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  button, a { -webkit-tap-highlight-color: transparent; }
  /* top bar + tabs */
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 24px; border-bottom: 2px solid var(--ink); }
  .top h1 { font-size: 15px; letter-spacing: .18em; font-weight: 700; }
  .badge { display: inline-block; padding: 0 8px; margin-left: 8px; font-size: 11px; letter-spacing: .06em; border: 1px solid var(--ink); }
  .badge.live { background: var(--dn); color: #fff; border-color: var(--dn); }
  .lamp { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
  .lamp i { width: 12px; height: 12px; background: var(--up); } .lamp.warn i { background: var(--acc); } .lamp.bad i { background: var(--dn); }
  nav.tabs { display: flex; gap: 4px; }
  nav.tabs a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; color: var(--mute); text-decoration: none; font-size: 14px; border-bottom: 3px solid transparent; }
  nav.tabs a[aria-current="page"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--acc); }
  .wrap { display: grid; grid-template-columns: 230px minmax(0,1fr); max-width: 1180px; margin: 0 auto; }
  .rail { padding: 22px 22px 0; border-right: 1px solid var(--line); }
  main { padding: 22px 24px; min-width: 0; }
  h2 { font-size: 11px; letter-spacing: .2em; color: var(--mute); margin-bottom: 10px; font-weight: 700; }
  h3 { font-size: 12px; color: var(--mute); margin: 12px 0 4px; font-weight: 700; }
  .up, .pos { color: var(--up); } .dn, .neg { color: var(--dn); } .warn { color: #8a5a00; } .muted, .note { color: var(--mute); } .note { font-size: 13px; }
  /* views */
  .view-home, .view-all, .view-full { display: none; }
  body.v-home .view-home, body.v-all .view-all, body.v-full .view-full { display: block; }
  body.v-home .rail { display: block; } body.v-all .rail, body.v-full .rail { display: none; } body.v-all .wrap, body.v-full .wrap { grid-template-columns: minmax(0,1fr); }
  /* timeline */
  .tl { list-style: none; padding: 0 0 0 14px; border-left: 2px solid var(--ink); margin-bottom: 26px; }
  .tl li { position: relative; padding: 0 0 14px 12px; font-size: 13px; line-height: 1.45; font-family: "Hiragino Sans","Noto Sans JP",system-ui,sans-serif; }
  .tl li::before { content: ""; position: absolute; left: -21px; top: 5px; width: 10px; height: 10px; background: var(--bg); border: 2px solid var(--ink); }
  .tl li.now::before { background: var(--acc); border-color: var(--acc); } .tl li.future::before { border-style: dashed; }
  .tl time { display: block; font-size: 11.5px; color: var(--mute); font-family: ui-monospace,Menlo,Consolas,monospace; }
  .kv { font-size: 13.5px; line-height: 2; margin-bottom: 20px; }
  /* status strip + numbers */
  .tiles { display: flex; gap: 30px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 6px; }
  .tile .l { font-size: 11px; color: var(--mute); letter-spacing: .1em; } .tile .v { font-size: 22px; font-weight: 700; line-height: 1.2; } .tiles .tile:first-child .v { font-size: 40px; line-height: 1.1; }
  .tile .s { font-size: 12px; color: var(--mute); }
  .hero { border-left: 6px solid var(--up); background: var(--panel); padding: 8px 14px; margin: 14px 0 22px; }
  .hero.warn { border-left-color: var(--acc); } .hero.bad { border-left-color: var(--dn); }
  .hero .w { display: none; } .hero h2 { font-size: 18px; letter-spacing: 0; color: var(--ink); margin: 0; } .hero p { font-size: 14px; overflow-wrap: anywhere; }
  .alerts { border: 1px solid var(--acc); background: #fff7df; padding: 10px 16px; margin-bottom: 18px; } .alerts.bad { border-color: var(--dn); background: #fdecea; }
  .alerts b { display: block; } .alerts li { margin-left: 1.2em; font-size: 14px; overflow-wrap: anywhere; }
  /* gauge rows (方向3) */
  .rows .hd, .r { display: grid; grid-template-columns: minmax(170px,290px) minmax(0,1fr) 100px; gap: 18px; align-items: center; }
  .rows .hd { font-size: 11px; color: var(--mute); letter-spacing: .1em; padding: 0 0 6px; border-bottom: 2px solid var(--ink); }
  .r { all: unset; box-sizing: border-box; display: grid; grid-template-columns: minmax(170px,290px) minmax(0,1fr) 100px; gap: 18px; align-items: center; width: 100%; min-height: 64px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .r:hover { background: var(--panel); } .r:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
  .r .c.b { color: var(--ink); opacity: .75; } .r .s { font-weight: 800; font-size: 17px; } .r .c { font-size: 12px; color: var(--mute); line-height: 1.3; overflow-wrap: anywhere; }
  .tag { white-space: nowrap; font-size: 11px; color: #6b4600; background: #ffe9ad; padding: 0 6px; margin-left: 6px; font-weight: 700; }
  .g { position: relative; height: 32px; } .g .tr { position: absolute; left: 0; right: 0; top: 11px; height: 4px; background: var(--line); }
  .g .sf { position: absolute; left: 0; top: 11px; height: 4px; background: #d9a9a1; } .g .e { position: absolute; top: 5px; width: 2px; height: 16px; background: var(--mute); }
  .g .p { position: absolute; top: 2px; width: 5px; height: 22px; background: var(--ink); transform: translateX(-2px); } .r.near .g .p { background: var(--dn); }
  .g .l { position: absolute; top: 21px; font-size: 10.5px; color: var(--mute); }
  .r .v { text-align: right; font-weight: 700; font-size: 18px; line-height: 1.2; } .r .v small { display: block; font-size: 12px; font-weight: 400; color: var(--mute); }
  .key { font-size: 12px; color: var(--mute); margin: 10px 0 0; }
  .more-link { all: unset; cursor: pointer; display: inline-flex; align-items: center; min-height: 44px; margin-top: 6px; color: var(--ink); font-weight: 700; border-bottom: 2px solid var(--ink); }
  .more-link:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  /* 盤: equal windows, green = profit, red = loss */
  .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); grid-auto-rows: 176px; gap: 10px; }
  .win { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; border-radius: 6px; overflow: hidden; color: #fff; background: var(--flat); min-width: 0; }
  .win.up { background: var(--up); } .win.dn { background: var(--dn); }
  .win:hover { filter: brightness(1.08); } .win:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .wt { display: flex; justify-content: space-between; align-items: center; padding: 4px 10px; background: rgba(0,0,0,.22); font-weight: 800; font-size: 14px; letter-spacing: .04em; }
  .wb { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 10px; }
  .box-pct { font-size: 26px; font-weight: 700; line-height: 1.15; } .wb .a { font-size: 13px; opacity: .95; }
  .wf { padding: 0 10px 8px; font-size: 12px; line-height: 1.35; opacity: .97; } .wf div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .wf .n { font-weight: 700; font-size: 13px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 2.7em; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0 14px; }
  .controls select { font: inherit; font-size: 14px; min-height: 44px; padding: 0 10px; border: 1px solid var(--ink); background: var(--panel); color: var(--ink); }
  .seg { display: inline-flex; border: 1px solid var(--ink); } .seg button { all: unset; cursor: pointer; min-height: 44px; padding: 0 18px; font-size: 14px; color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 700; } .seg button:focus-visible { outline: 3px solid var(--acc); outline-offset: -3px; }
  .fchip { all: unset; cursor: pointer; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; }
  .fchip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); } .fchip:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  /* detail sheet */
  .sheet-bg { position: fixed; inset: 0; background: rgba(21,32,27,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 20; animation: fade .12s ease-out; }
  .sheet { background: var(--panel); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; padding: 18px 20px 26px; border-top: 4px solid var(--ink); }
  @media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border: 1px solid var(--ink); border-top-width: 4px; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .sheet-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .sheet .x { all: unset; cursor: pointer; font-size: 28px; line-height: 1; min-width: 44px; min-height: 44px; text-align: center; } .sheet .x:focus-visible { outline: 3px solid var(--ink); }
  .sym { font-weight: 800; font-size: 17px; } .sym.big { font-size: 28px; } .co { font-size: 12.5px; color: var(--mute); } .big { font-size: 28px; font-weight: 800; }
  .why1 { font-size: 12px; color: #6b4600; background: #ffe9ad; padding: 0 8px; display: inline-block; }
  .why h4 { font-size: 12px; color: var(--mute); margin: 14px 0 2px; font-weight: 700; letter-spacing: .08em; } .why p { overflow-wrap: anywhere; font-size: 15px; }
  .why .plan { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 4px; }
  .why .plan div { background: var(--bg); border: 1px solid var(--line); padding: 6px 10px; } .why .plan b { display: block; font-size: 16px; } .why .plan span { color: var(--mute); font-size: 12px; }
  /* chart + misc panels */
  section, .card { background: var(--panel); border: 1px solid var(--line); padding: 16px 18px; margin-bottom: 14px; }
  .card h2, section h2 { margin-bottom: 8px; }
  canvas { width: 100%; height: 150px; display: block; }
  .bar { height: 8px; background: var(--line); margin: 8px 0 4px; } .bar i { display: block; height: 100%; background: var(--ink); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; } .chip { border: 1px solid var(--ink); padding: 0 12px; font-size: 14px; } .chip.grey { border-color: var(--line); color: var(--mute); }
  details { margin: 4px 0; } summary { cursor: pointer; min-height: 32px; font-size: 14px; text-decoration: underline; }
  ul.plain { list-style: none; padding: 0; } ul.plain li { padding: 3px 0; border-bottom: 1px solid var(--line); color: var(--mute); font-size: 13px; overflow-wrap: anywhere; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .grid .card { margin-bottom: 0; padding: 10px 14px; } .grid .card .label { color: var(--mute); font-size: 12px; } .grid .card .value { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; } .grid .card .sub { color: var(--mute); font-size: 11px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; } th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th { color: var(--mute); font-weight: 500; font-size: 12px; } th:first-child, td:first-child, td.l, th.l { text-align: left; }
  .scroll { overflow-x: auto; } .scroll table { min-width: 520px; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; } .cols { align-items: start; } .cols section { margin-bottom: 0; min-width: 0; } .cols .scroll table { min-width: 0; } .cols th, .cols td { white-space: normal; overflow-wrap: anywhere; }
  .banner { padding: 8px 12px; margin-bottom: 10px; font-size: 13px; border-left: 4px solid; } .banner.WARNING { background: #fff7df; border-color: var(--acc); } .banner.CRITICAL { background: #fdecea; border-color: var(--dn); } .banner.info { background: var(--panel); border-color: var(--ink); }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; color: var(--mute); }
  #error { display: none; margin: 10px 24px 0; } footer { color: var(--mute); font-size: 12px; padding: 0 24px; max-width: 1180px; margin: 0 auto; }
  /* phone: bottom tabs, one column */
  @media (max-width: 760px) {
    .top { padding: 10px 16px; } nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; background: var(--ink); gap: 0; }
    nav.tabs a { flex: 1; justify-content: center; color: #cfd6d0; border-bottom: 0; border-top: 3px solid transparent; } nav.tabs a[aria-current="page"] { color: #fff; border-top-color: var(--acc); }
    .wrap { grid-template-columns: minmax(0,1fr); } .rail { order: 2; border-right: 0; border-top: 1px solid var(--line); padding: 14px 16px 0; margin-top: 8px; }
    .tl { display: flex; flex-wrap: wrap; gap: 6px 22px; border-left: 0; border-top: 2px solid var(--ink); padding: 12px 0 6px; margin-bottom: 8px; } .tl li { flex: 0 0 auto; padding: 0; } .tl li::before { display: none; }
    main { padding: 16px; } .tiles .tile:first-child .v { font-size: 32px; } #error { margin: 10px 16px 0; } footer { padding: 0 16px; }
    .rows .hd { display: none; } .r { grid-template-columns: minmax(0,1fr) auto; gap: 4px 10px; } .r .g { grid-column: 1 / -1; order: 3; }
    .board { grid-template-columns: repeat(2, minmax(0,1fr)); } .box-pct { font-size: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="top"><h1>運用ダッシュボード<span id="env" class="badge">…</span></h1>
  <nav class="tabs" aria-label="画面の切り替え"><a id="tHome" href="#home">今日</a><a id="tAll" href="#all">銘柄</a><a id="tFull" href="#full">詳細</a></nav>
  <span class="lamp" id="lamp"><i></i><span id="lampText">…</span></span></div>
<div id="error" class="banner CRITICAL"></div>
<div class="wrap"><aside class="rail view-home"><h2>今日の流れ</h2><ul class="tl" id="tl"></ul><h2>状態</h2><div class="kv" id="stt"></div></aside>
<main>
<div class="view-home">
  <div class="tiles" id="tiles"></div>
  <div id="hero"></div><div id="findings"></div>
  <h2>気にしてほしい銘柄　<span style="font-weight:400;letter-spacing:0">損切り ─ 現在 ─ 目標 の位置</span></h2>
  <div id="holdings"></div>
  <div class="card" style="margin-top:22px"><h2>資産の推移</h2><canvas id="chart" width="800" height="150" role="img" aria-label="資産の推移の折れ線グラフ"></canvas>
    <div class="note" style="display:flex;justify-content:space-between"><span id="d0"></span><span id="d1"></span></div>
    <div class="bar"><i id="progress" style="width:0"></i></div><div class="note" id="perfWarn"></div></div>
  <div class="card"><h2 id="didTitle">直近のセッションでしたこと</h2><div id="did"></div></div>
</div>
<div class="view-all">
  <h2 id="allTitle">持っている全ての銘柄</h2><div id="allHead" class="note"></div>
  <div class="controls"><div class="seg" role="group" aria-label="表示の形"><button id="mBoard" type="button" aria-pressed="true">盤</button><button id="mList" type="button" aria-pressed="false">表</button></div>
    <label class="note">並べ方 <select id="sortSel"><option value="attention">気にしてほしい順</option><option value="pnl_pct">損益％の高い順</option><option value="pnl_pct_asc">損益％の低い順</option><option value="value">評価額の大きい順</option><option value="symbol">ティッカー順</option></select></label></div>
  <div class="controls" id="catChips" role="group" aria-label="系統で絞る"></div>
  <div id="allBody"></div>
</div>
<div class="view-full">
<div class="grid" id="runnerCards"></div>
<section><h2>成績</h2><div class="grid" id="perfCards"></div></section>
<section><h2>セッション（新しい順）</h2><div class="scroll"><table id="sessions"></table></div></section>
<section><h2>最新セッションの詳細</h2><div id="latest"></div></section>
<div class="cols" id="observers"></div>
<section><h2>障害（インシデント）</h2><div id="incidents"></div></section>
<section><h2>人の意図</h2><div id="intents"></div></section>
<section><h2>通知の履歴</h2><div id="alerts"></div></section>
</div>
</main></div>
<div id="sheetHost"></div>
<footer id="footer"></footer>

<script>
"use strict";
const token = new URLSearchParams(location.search).get("token");
const headers = token ? { Authorization: "Bearer " + token } : {};

// All data is rendered through textContent — never as HTML — because it contains text we did not write
// (news-derived reasons, incident descriptions, operator-typed reasons).
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return e;
}
const money = (x) => x == null ? "—" : (x < 0 ? "-$" : "$") + Math.abs(x).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (x, d = 2) => x == null ? "—" : (x * 100).toFixed(d) + "%";
const signed = (x, f) => x == null ? "—" : (x > 0 ? "+" : "") + f(x);
const cls = (x) => x > 0 ? "pos" : x < 0 ? "neg" : "";
const jst = (iso) => iso ? new Date(iso).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", hour12: false }) + " JST" : "—";
const et = (iso) => iso ? new Date(iso).toLocaleString("en-US", { timeZone: "America/New_York", hour12: false }) + " ET" : "—";
const card = (label, value, sub, c) => el("div", { class: "card" }, el("div", { class: "label", text: label }),
  el("div", { class: "value " + (c || ""), text: value }), sub ? el("div", { class: "sub", text: sub }) : null);
function table(head, rows, leftCols = 1) {
  const t = el("table");
  t.append(el("thead", {}, el("tr", {}, head.map((h, i) => el("th", { class: i < leftCols ? "l" : "", text: h })))));
  t.append(el("tbody", {}, rows.map((r) => el("tr", {}, r.map((c, i) => {
    const text = (c && typeof c === "object" && "t" in c) ? c.t : c;
    return el("td", { class: ((c && c.c) || "") + (i < leftCols ? " l" : ""), text: text == null ? "—" : text });
  })))));
  return el("div", { class: "scroll" }, t);
}
function panel(title, ...body) { return el("section", {}, el("h2", { text: title }), body); }
async function get(path) {
  const r = await fetch(path, { headers });
  if (!r.ok) throw new Error(path + " → HTTP " + r.status);
  return r.json();
}
function setChildren(id, ...kids) { const e = document.getElementById(id); e.replaceChildren(...kids.flat(Infinity).filter(Boolean)); }
function errorBox(data) { return data && data.error ? el("div", { class: "banner CRITICAL", text: data.error }) : null; }

// <ja-translator>
// Display-only Japanese for the English sentences our own services write (watchdog, funnel, observers). The
// originals stay untouched (alerts, CLI and tests use them); a sentence with no rule is shown as written, and
// free text we did not author (AI objections, exception messages) is never guessed at.
const SYM = "[A-Z][A-Z0-9.\\-]{0,9}";
const dropSym = (x) => x.replace(new RegExp("^" + SYM + ": "), "");
const JA_RULES = [
  // watchdog findings
  [/^the runner was stopped on request$/, () => "ランナーは停止操作で止まっています。"],
  [/^the runner stopped on a failure: ([\s\S]*)$/, (m) => "ランナーが異常で止まりました: " + m[1]],
  [/^the runner has never written a status file$/, () => "ランナーが一度も状態ファイルを書いていません。"],
  [/^no heartbeat for (\d+) min \(state (\w+), limit (\d+) min\)$/, (m) => "心拍が " + m[1] + " 分途絶えています（状態 " + m[2] + "、上限 " + m[3] + " 分）。"],
  [/^risk state is (\w+)$/, (m) => "リスク状態が " + m[1] + " です（通常ではありません）。"],
  [/^unresolved MAJOR incident (.+)$/, (m) => "未解決の重大障害 " + m[1] + " があります。"],
  [/^the operator kill switch is engaged \(entries halted\)$/, () => "緊急停止スイッチが作動中です（新しい買いは止まっています）。"],
  [/^LIVE system without a valid human approval \(no entries\)$/, () => "LIVE のシステムに、有効な人の承認がありません（買いは行われません）。"],
  [/^today's session \((.+)\) has not run; last session (.+)$/, (m) => "本日（" + m[1] + "）のセッションがまだ実行されていません。前回は " + (m[2] === "never" ? "なし" : m[2]) + " です。"],
  [/^the trading calendar has no data for this year$/, () => "取引カレンダーに今年のデータがありません。"],

    el("p", { class: "note", style: "margin-top:10px", text: "損切りは取引所に置いた注文で自動的に働きます。計画は買う前に作られたものです。" }));
  const closeBtn = el("button", { class: "x", type: "button", "aria-label": "閉じる", text: "×" });
  closeBtn.addEventListener("click", close);
  const bg = el("div", { class: "sheet-bg" }, el("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": x.symbol + " の理由と計画" },
    el("div", { class: "sheet-top" },
      el("div", {}, el("div", { class: "sym big", text: x.symbol }), el("div", { class: "co", text: nameOf(x) + (x.company && x.company_ja && x.company_ja.indexOf(x.company) < 0 ? "（" + x.company + "）" : "") }),
      el("div", { class: "co", text: (x.category || "系統は未登録") + (x.business ? " ／ " + x.business : "") })),
      closeBtn),
    el("div", { style: "margin:8px 0 2px" }, el("span", { class: "big num " + cls(x.pnl), text: arrow(x.pnl) + " " + signed(x.pnl_pct, pct) }), "  ", el("b", { class: "num " + cls(x.pnl), text: signed(x.pnl, money) })),
    el("div", { class: "note", text: qtyText(x.qty) + " 株 · 買値 " + money(x.avg_cost) + " → いま " + money(x.price) + " · 評価額 " + money(x.value) + " · 資産の " + pct(x.weight, 0) }),
    x.attention_reasons.length ? el("div", { class: "why1", style: "margin-top:8px", text: x.attention_reasons.join(" / ") }) : null,
    why));
  bg.addEventListener("click", (e) => { if (e.target === bg) close(); });
  setChildren("sheetHost", bg); closeBtn.focus();
}

const holdMsg = (id, text, c) => setChildren(id, el("div", { class: c || "muted", text }));
function renderHoldings(h) {
  holdData = h;
  if (h.error) { setChildren("holdings", errorBox(h)); return renderAll(); }
  if (!h.session_date) return holdMsg("holdings", "まだセッションがありません。");
  if (!h.recorded) return holdMsg("holdings", h.session_date + " のセッションは、銘柄ごとの記録が残る前のものです。次のセッションから表示されます。");
  const byS = new Map(h.holdings.map((x) => [x.symbol, x]));
  const picks = h.attention.map((k) => byS.get(k)).filter(Boolean);
  if (!h.holdings.length) return holdMsg("holdings", "いまは何も持っていません（現金 " + money(h.cash) + "）。");
  const pnl = h.holdings.reduce((t, x) => t + x.pnl, 0), cost = h.holdings.reduce((t, x) => t + x.qty * x.avg_cost, 0);
  const more = el("button", { class: "more-link", type: "button", text: "全 " + h.holdings.length + " 銘柄を見る →" });
  more.addEventListener("click", () => { location.hash = "all"; });
  setChildren("holdings",
    el("div", { class: "note", style: "margin-bottom:8px" }, "全 " + h.holdings.length + " 銘柄の合計 ", el("b", { class: "num " + cls(pnl), text: signed(pnl, money) + "（" + signed(cost > 0 ? pnl / cost : 0, pct) + "）" }),
      "　現金 " + money(h.cash) + "　損切りに近い順など、最大 " + picks.length + " 件"),
    el("div", { class: "rows" }, rowsHead(), picks.map(holdingRow)), rowsKey(), more,
    el("div", { class: "note", style: "margin-top:6px", text: h.session_date + " のセッション時点の値です（リアルタイムではありません）。" }));
  renderAll();
}

function renderAll() {
  const h = holdData, host = document.getElementById("allBody");
  if (!h || !h.recorded) { host.replaceChildren(); return; }
  const sort = document.getElementById("sortSel").value;
  const cats = [...new Set(h.holdings.map((x) => x.category || "未分類"))].sort();
  const chip = (label, val) => { const c = el("button", { class: "fchip", type: "button", "aria-pressed": String(catFilter === val), text: label });
    c.addEventListener("click", () => { catFilter = val; renderAll(); }); return c; };
  setChildren("catChips", chip("すべて", null), cats.map((c) => chip(c, c)));
  let items = h.holdings.filter((x) => catFilter === null || (x.category || "未分類") === catFilter);
  const cmp = { attention: (a, b) => b.attention_score - a.attention_score || Math.abs(b.pnl_pct) - Math.abs(a.pnl_pct),
    pnl_pct: (a, b) => b.pnl_pct - a.pnl_pct, pnl_pct_asc: (a, b) => a.pnl_pct - b.pnl_pct,
    value: (a, b) => b.value - a.value, symbol: (a, b) => a.symbol.localeCompare(b.symbol) }[sort];
  items = [...items].sort(cmp);
  const pnl = items.reduce((t, x) => t + x.pnl, 0);
  setChildren("allHead", items.length + " 銘柄 · 合計 " + signed(pnl, money) + " · " + h.session_date + " のセッション時点。緑＝利益、赤＝損失。大きさは全て同じです。");
  document.getElementById("mBoard").setAttribute("aria-pressed", String(allMode === "board"));
  document.getElementById("mList").setAttribute("aria-pressed", String(allMode === "list"));
  host.replaceChildren(allMode === "board" ? el("div", { class: "board" }, items.map(holdingWindow)) : el("div", { class: "rows" }, rowsHead(), items.map(holdingRow), rowsKey()));
}

function route() {
  const view = location.hash === "#all" ? "all" : location.hash === "#full" ? "full" : "home";
  document.body.className = "v-" + view;
  for (const [id, v] of [["tHome", "home"], ["tAll", "all"], ["tFull", "full"]]) {
    const a = document.getElementById(id); if (v === view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  }
  if (view === "home") drawChart(lastSeries);
  window.scrollTo(0, 0);
}
document.getElementById("mBoard").addEventListener("click", () => { allMode = "board"; renderAll(); });
document.getElementById("mList").addEventListener("click", () => { allMode = "list"; renderAll(); });
document.getElementById("sortSel").addEventListener("change", renderAll);
window.addEventListener("hashchange", route);

// the day's flow, from what the system recorded (nothing is invented)
const riskWord = (r) => r === "NORMAL" ? "通常" : r === "HALT_NEW_ENTRIES" ? "買い停止中" : r || "—";
function renderRail(s, ss) {
  const r = s.runner, last = (ss.sessions || [])[0], items = [];
  if (last) {
    items.push([jstShort(last.recorded_at), "セッション実行（" + last.session_date + "）", ""]);
    items.push(["", "候補 " + last.candidates + " → 約定 " + last.orders_filled + (last.stops_triggered ? "・損切り " + last.stops_triggered : ""), ""]);
  }
  if (s.checkpoint && s.checkpoint.at) items.push([jstShort(s.checkpoint.at), "口座を保存", "now"]);
  if (r && r.next_session_at) items.push([jstShort(r.next_session_at), "次のセッション", "future"]);
  setChildren("tl", items.length ? items.map((x) => el("li", { class: x[2] }, x[0] ? el("time", { text: x[0] }) : null, x[1])) : el("li", { text: "まだ記録がありません" }));
  setChildren("stt", el("div", {}, "安全装置　", el("b", { text: r ? riskWord(r.risk_state) : "—" })),
    el("div", {}, "緊急停止　", el("b", { text: s.kill_switch.engaged ? "作動中" : "解除中" })),
    el("div", {}, "次の取引　", el("b", { text: r && r.next_session_at ? jstShort(r.next_session_at) : "—" })));
}

function renderDid(o, sessions) {
  const last = (sessions.sessions || [])[0];
  document.getElementById("didTitle").textContent = (o.session_date || "直近") + " にしたこと";
  if (!o.session_date) return setChildren("did", el("div", { class: "muted", text: "まだありません" }));
  const fills = o.fills || [], reasons = o.no_trade_reasons || [];
  setChildren("did", errorBox(o),
    el("div", { class: "chips" },
      fills.map((f) => el("span", { class: "chip", text: (f.side === "BUY" ? "買い " : "売り ") + f.symbol })),
      last && last.stops_triggered ? el("span", { class: "chip", text: "損切り " + last.stops_triggered + " 件" }) : null,
      el("span", { class: "chip grey", text: "見送り " + reasons.length + (reasons.length >= 10 ? " 件以上" : " 件") })),
    reasons.length ? el("details", {}, el("summary", { text: "見送った理由を見る" }), el("ul", { class: "plain" }, reasons.map((x) => el("li", { text: ja(x) })))) : null,
    (o.data_warnings || []).length ? el("ul", { class: "plain" }, o.data_warnings.map((x) => el("li", { class: "warn", text: ja(x) }))) : null);
}

function renderSessions(d) {
  setChildren("sessions", errorBox(d), table(["日付", "資産", "日次損益", "DD", "候補", "約定", "損切り", "保有", "警告", "リスク", "LLM費用"],
    (d.sessions || []).slice(0, 20).map((r) => [r.session_date, money(r.equity), { t: signed(r.day_pnl, (v) => v.toFixed(2)), c: cls(r.day_pnl) },
      pct(r.drawdown), r.candidates, r.orders_filled, r.stops_triggered, r.open_positions, r.data_warnings,
      { t: r.risk_state, c: r.risk_state === "NORMAL" ? "" : "warn" }, r.llm_cost_usd == null ? "—" : money(r.llm_cost_usd)])));
}

function renderObservers(o) {
  const O = o.observers || {}, parts = [];
  setChildren("latest", errorBox(o), o.session_date ? [
    el("div", { class: "muted", text: "セッション " + o.session_date }),
    el("h3", { text: "見送り・除外の理由（上位10）" }),
    el("ul", { class: "plain" }, (o.no_trade_reasons || []).slice(0, 10).map((x) => el("li", { text: ja(x) }))),
    (o.data_warnings || []).length ? [el("h3", { text: "データ警告" }), el("ul", { class: "plain" }, o.data_warnings.map((x) => el("li", { class: "warn", text: ja(x) })))] : null,
    el("h3", { text: "約定" }),
    (o.fills || []).length ? table(["銘柄", "売買", "数量", "価格"], o.fills.map((f) => [f.symbol, f.side, qtyText(f.qty), money(f.price)])) : el("div", { class: "muted", text: "なし" }),
    Object.keys(o.disagreement_multipliers || {}).length ? [el("h3", { text: "モデル不一致によるサイズ係数（1.0=縮小なし）" }),
      table(["銘柄", "係数"], Object.entries(o.disagreement_multipliers).map(([k, v]) => [k, { t: v.toFixed(3), c: v < 0.9 ? "warn" : "" }]))] : null,
  ] : el("div", { class: "muted", text: "まだありません" }));

  if (O.forecast) { const f = O.forecast, cal = f.calibration || {};
    parts.push(panel("予測の較正（§32）", el("div", { class: "muted", text: "記録 " + f.recorded + " · 採点済み " + f.resolved + " · 待ち " + f.pending + " · 採点不能 " + f.skipped }),
      Object.keys(cal).length ? table(["シナリオ", "予測確率", "実現頻度", "差"], ["bear", "base", "bull"].map((k) => [k, pct(cal[k].predicted), pct(cal[k].realized), signed(cal[k].gap, (v) => pct(v))])) : el("div", { class: "muted", text: "採点できた予測がまだありません" }))); }
  if (O.shadow) { const s = O.shadow;
    parts.push(panel("シャドー比較（§56-58）", el("div", { class: "muted", text: s.sessions + " セッション" }),
      table(["変種", "累積リターン"], (s.ranking || []).map((r) => [r.variant, { t: pct(r.total_return), c: cls(r.total_return) }])),
      el("div", { text: "AIスタックの寄与（FULL − QUANT_ONLY）: " + (s.ai_stack_contribution == null ? "—" : signed(s.ai_stack_contribution, (v) => pct(v))) }),
      Object.keys(s.alpha_shadow || {}).length ? table(["Alpha", "回数", "平均リターン"], Object.entries(s.alpha_shadow).map(([k, v]) => [k, v.sessions, pct(v.mean_return)])) : null,
      el("ul", { class: "plain" }, (s.caveats || []).map((c) => el("li", { text: ja(c) }))))); }
  if (O.attribution) { const a = O.attribution;
    parts.push(panel("損益分解（§54-55）", el("div", { class: "muted", text: "閉じた取引 " + a.closed_trades + " · 未帰属 " + a.unattributed + " · " + ja(a.assumption) }),
      table(["項目", "金額"], [["合計", money(a.total_pnl)], ["市場β", money(a.market_beta_pnl)], ["alpha", money(a.alpha_pnl)], ["スリッページ", money(-a.slippage)], ["手数料", money(-a.fees)]]),
      a.profit_quality ? el("div", { text: "利益の質: " + a.profit_quality.source + "（" + a.profit_quality.score + "）— " + a.profit_quality.detail }) : null)); }
  if (O.exit_review) { const e = O.exit_review, st = e.stops || {}, cf = e.counterfactual || {};
    parts.push(panel("出口・見送りの検証（§50-53）",
      el("div", { text: "採点済み損切り " + (st.graded || 0) + " · 良い " + pct(st.good_rate || 0, 0) + " · 早すぎ " + pct(st.early_rate || 0, 0) }),
      el("div", { text: "見送りの追跡 " + cf.tracked + " 件（1週間後の結果あり " + cf.with_1w_outcome + "）· 平均 " + (cf.mean_1w_return_of_skipped == null ? "—" : pct(cf.mean_1w_return_of_skipped)) }),
      (e.proposals || []).length ? table(["提案", "段階"], e.proposals.map((p) => [p.name, p.stage])) : el("div", { class: "muted", text: "出口の研究提案: なし" }))); }
  if (O.daily_review && O.daily_review.grades) { const d = O.daily_review;
    parts.push(panel("日次レビュー（§63-64）", el("div", { text: d.day + " · 損益 " + signed(d.pnl, (v) => v.toFixed(2)) }),
      table(["観点", "評価"], Object.entries(d.grades).map(([k, v]) => [k, v])), el("ul", { class: "plain" }, (d.narrative || []).map((n) => el("li", { text: ja(n) }))))); }
  if (O.human_vs_ai) { const h = O.human_vs_ai;
    parts.push(panel("人 vs AI（§79）", el("div", { text: "介入 " + h.overrides + " · 結果が出た " + h.resolved + " · 待ち " + h.pending }),
      el("div", { text: "人の付加価値: " + (h.human_value_added == null ? "—" : h.human_value_added) + "（" + ja(h.unit) + "）" }))); }
  if (O.capital_cells) { const c = O.capital_cells, rc = c.reconciliation || {}, latest = rc.latest;
    parts.push(panel("資本セル（案A・観測のみ）",
      el("div", { class: rc.sessions_inconsistent ? "warn" : "pos", text: "照合 " + rc.sessions_checked + " 回 · 不一致 " + rc.sessions_inconsistent + " 回" }),
      latest ? table(["セル", "現金", "評価額", "実現損益"], Object.entries(latest.cells).map(([k, v]) => [k, money(v.cash), money(v.marked_equity), money(v.virtual_realized_pnl)])) : null,
      (c.errors || []).length ? el("ul", { class: "plain" }, c.errors.map((x) => el("li", { class: "warn", text: x }))) : null,
      el("div", { class: "muted", text: "未配分プール " + money(c.unallocated_cash) + " · " + ja(c.note) }))); }
  if (O.pit) parts.push(panel("Point-in-Time 記録（§10）", el("div", { text: "判断の入力・出力を記録: " + O.pit.decisions_recorded + " 件" })));
  setChildren("observers", parts.length ? parts : [el("div", { class: "muted", text: "観測者の出力はまだありません" })]);
}

function renderIncidents(d) {
  setChildren("incidents", errorBox(d), (d.incidents || []).length ? table(["ID", "重大度", "状態", "サービス", "内容"],
    d.incidents.map((i) => [i.incident_id, i.severity, { t: i.resolved ? "解決" : "未解決", c: i.resolved ? "" : "neg" }, i.service, i.description]), 1) : el("div", { class: "muted", text: "記録なし" }));
}
function renderIntents(d) {
  setChildren("intents", errorBox(d), (d.intents || []).length ? (d.intents || []).map((i) => el("div", {},
    el("div", {}, el("b", { text: i.intent_id + " " + i.symbol + " " }), el("span", { class: i.status === "CONFIRMED" ? "warn" : "muted", text: i.status }),
      el("span", { class: "muted", text: " · " + i.submitted_by + " · " + i.reason })),
    i.outcome ? el("div", { class: "muted", text: "結果: " + i.outcome }) : null,
    i.analysis ? el("details", {}, el("summary", { text: "分析を見る" }), el("pre", { text: JSON.stringify(i.analysis, null, 2) })) : null))
    : el("div", { class: "muted", text: "なし（提出・確認・取消は scripts/human_intent.py）" }));
}
function renderAlerts(d) {
  setChildren("alerts", (d.alerts || []).length ? el("ul", { class: "plain" }, d.alerts.slice(0, 15).map((a) =>
    el("li", { class: a.severity === "CRITICAL" ? "neg" : "warn", text: jst(a.at) + " [" + a.severity + "] " + a.message }))) : el("div", { class: "muted", text: "通知はありません" }));
}

async function refresh() {
  try {
    const [s, p, ss, o, inc, intents, al, hold] = await Promise.all([get("/api/status"), get("/api/performance"), get("/api/sessions?limit=60"),
      get("/api/observers"), get("/api/incidents"), get("/api/intents"), get("/api/alerts?limit=50"), get("/api/holdings")]);
    renderStatus(s); renderRail(s, ss); renderPerf(p); renderHoldings(hold); renderDid(o, ss); renderSessions(ss); renderObservers(o); renderIncidents(inc); renderIntents(intents); renderAlerts(al);
    document.getElementById("error").style.display = "none";
    document.getElementById("footer").textContent = "更新 " + jst(s.now) + " · 30秒ごとに自動更新 · 表示のみ（操作は CLI）。数字は直近のセッション時点で、リアルタイムではありません。";
  } catch (e) {
    const b = document.getElementById("error"); b.style.display = "block"; b.textContent = "取得に失敗しました: " + e.message;
  }
}
route();
refresh(); setInterval(refresh, 30000); window.addEventListener("resize", () => drawChart(lastSeries));
</script>
