<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方向2 盤面</title>
<style>
:root{--bg:#12161a;--panel:#1a2026;--line:#2b343d;--ink:#e8e4da;--mute:#8d96a0;--sand:#e6c98a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;display:grid;grid-template-columns:168px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:22px 0;position:sticky;top:0;height:100vh}
aside b{display:block;padding:0 22px 22px;letter-spacing:.3em;font-size:14px;color:var(--sand)}
aside a{display:block;padding:9px 22px;color:var(--mute);text-decoration:none;border-left:3px solid transparent;font-size:14px}aside a.on{color:var(--ink);border-left-color:var(--sand);background:#ffffff08}
main{padding:0 26px 40px;min-width:0}
.bar{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.lamp{display:inline-flex;align-items:center;gap:8px;font-weight:700}.lamp i{width:9px;height:9px;border-radius:50%;background:#58b37a;box-shadow:0 0 0 4px #58b37a33}
.bar span{color:var(--mute)}.bar b{color:var(--ink);font-weight:600}
.nums{display:flex;gap:44px;flex-wrap:wrap;padding:20px 0 14px;align-items:flex-end}
.nums small{display:block;color:var(--mute);font-size:12px;letter-spacing:.08em}.nums b{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}.nums b.s{font-size:24px}
.up{color:#6fc08a}.dn{color:#e07a66}
.board{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.tm{position:relative;height:430px;background:#0d1013;border:1px solid var(--line)}
.t{position:absolute;overflow:hidden;border:2px solid var(--bg);padding:8px 10px;cursor:pointer;color:#fff;transition:filter .12s}
.t:hover{filter:brightness(1.18)}.t.sel{outline:2px solid var(--sand);outline-offset:-4px;z-index:2}
.t b{display:block;font-size:17px;line-height:1.2}.t span{font-size:13px;opacity:.92;font-variant-numeric:tabular-nums}.t small{display:block;font-size:11px;opacity:.7;line-height:1.3;margin-top:2px}
.legend{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin:8px 0 0}
.leg{height:8px;background:linear-gradient(90deg,#8a3a2c,#4b3b36 50%,#2f6b49);margin-top:6px}
.side{background:var(--panel);border:1px solid var(--line);padding:16px 18px;position:sticky;top:12px}
.side h3{font-size:22px}.side .co{color:var(--mute);font-size:13px;margin-bottom:10px}.side h4{font-size:11px;color:var(--sand);letter-spacing:.14em;margin:14px 0 3px;font-weight:600}
.gauge{height:6px;background:#2a323a;border-radius:3px;position:relative;margin:26px 0 6px}.gauge i{position:absolute;top:-5px;width:3px;height:16px;background:var(--sand)}
.gl{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
h2{font-size:12px;letter-spacing:.2em;color:var(--mute);margin:22px 0 10px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips a{padding:2px 12px;border:1px solid var(--line);border-radius:3px;color:var(--mute);font-size:12.5px;text-decoration:none}.chips a.on{color:var(--bg);background:var(--sand);border-color:var(--sand)}
@media(max-width:820px){body{grid-template-columns:1fr;padding-bottom:58px}aside{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;display:flex;border-right:0;border-top:1px solid var(--line);background:var(--bg);padding:0;z-index:5}aside b{display:none}aside a{flex:1;text-align:center;padding:14px 4px;border-left:0;border-top:3px solid transparent;font-size:12.5px}aside a.on{border-top-color:var(--sand)}
.board{grid-template-columns:1fr}.tm{height:380px}.side{position:static}main{padding:0 14px 30px}.nums{gap:24px}.nums b{font-size:28px}}
</style></head><body>
<aside><b>盤面</b><a class="on" href="#">俯瞰</a><a href="#">銘柄</a><a href="#">記録</a><a href="#">AI判断</a><a href="#">安全</a></aside>
<main>
<div class="bar"><span class="lamp"><i></i>正常に稼働</span><span>次の取引 <b>11/10（火）23:45</b></span><span>安全装置 <b>通常</b></span><span>口座の保存 <b>8/14 23:46</b></span><span>検証 <b>17/60</b> 営業日</span></div>
<div class="nums"><div><small>いまの資産</small><b id="eq"></b></div><div><small>はじめから</small><b class="s up" id="gain"></b></div><div><small>いちばん減った幅</small><b class="s">1.12%</b></div></div>
<div class="board"><div><div class="tm" id="tm"></div><div class="legend"><span>-3%</span><span>面積＝資産に占める割合　色＝買値からの損益</span><span>+3%</span></div><div class="leg"></div></div>
<div class="side" id="side"></div></div>
<h2>系統で絞る</h2><div class="chips" id="chips"></div>
</main><script src="data.js"></script><script>
const S=SAMPLE;$("eq").textContent=usd(S.equity);$("gain").textContent=usd(S.equity-S.start,1);
function squarify(items,x,y,w,h){const out=[];let list=[...items].sort((a,b)=>b.v-a.v),tot=list.reduce((t,i)=>t+i.v,0);
 (function lay(list,x,y,w,h,tot){if(!list.length)return;if(list.length===1){out.push({...list[0],x,y,w,h});return}
  const horiz=w>=h,side=horiz?h:w;let row=[],best=Infinity,sum=0;
  for(const it of list){const t=[...row,it],s=sum+it.v,len=s/tot*(horiz?w:h)||0,worst=Math.max(...t.map(r=>{const a=r.v/s*side;return Math.max(len/a,a/len)}));
   if(worst>best&&row.length)break;row=t;sum=s;best=worst}
  const len=sum/tot*(horiz?w:h);let off=0;
  for(const r of row){const a=r.v/sum*side;out.push({...r,x:horiz?x:x+off,y:horiz?y+off:y,w:horiz?len:a,h:horiz?a:len});off+=a}
  const rest=list.slice(row.length);horiz?lay(rest,x+len,y,w-len,h,tot-sum):lay(rest,x,y+len,w,h-len,tot-sum)})(list,x,y,w,h,tot);return out}
const col=p=>{const t=Math.max(-1,Math.min(1,p/0.03));return t>=0?`rgb(${Math.round(75-28*t)},${Math.round(59+48*t)},${Math.round(54+19*t)})`:`rgb(${Math.round(75+63*-t)},${Math.round(59-1*-t)},${Math.round(54-10*-t)})`};
let sel=S.H[0].sym;
function draw(){const el=$("tm"),W=el.clientWidth,Hh=el.clientHeight;
 el.innerHTML=squarify(S.H.map(h=>({...h,v:h.value})),0,0,W,Hh).map(r=>`<div class="t ${r.sym===sel?"sel":""}" data-s="${r.sym}" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:${col(r.pct)}"><b>${r.sym}</b><span>${pc(r.pct)}</span>${r.w>120&&r.h>86?`<small>${r.co}</small>`:""}</div>`).join("");
 el.querySelectorAll(".t").forEach(t=>t.onclick=()=>{sel=t.dataset.s;draw()});
 const h=S.H.find(x=>x.sym===sel);
 $("side").innerHTML=`<h3>${h.sym}</h3><div class="co">${h.co}・${h.cat}</div><div style="font-size:28px;font-weight:600" class="${sgn(h.pct)}">${pc(h.pct)} <span style="font-size:15px">${usd(h.pnl,1)}</span></div>
 <h4>なぜ持っているか</h4><div>${h.why}</div><h4>今後の計画</h4>
 <div class="gauge"><i style="left:${Math.max(0,Math.min(100,h.pos*100))}%"></i></div><div class="gl"><span>損切り ${usd(h.stop)}</span><span>目標 ${usd(h.target)}</span></div>
 <div class="gl" style="margin-top:6px"><span>いまから ${pc(h.toStop)}</span><span>${pc(h.toTarget)}</span></div><div style="margin-top:8px;color:var(--mute);font-size:13px">保有の目安 ${h.hz}・資産の ${(h.weight*100).toFixed(0)}%</div>`}
draw();addEventListener("resize",draw);
const cats=[...new Set(S.H.map(h=>h.cat))];$("chips").innerHTML=`<a class="on" href="#">すべて</a>`+cats.map(c=>`<a href="#">${c}</a>`).join("");
</script></body></html>
