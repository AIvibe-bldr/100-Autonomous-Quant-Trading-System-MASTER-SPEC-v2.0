<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>案B ストーリー型</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2b2118;--mute:#8a7d6f;--line:#eadfce;--ok:#2f855a;--warn:#c05621;--bad:#c53030;--accent:#b7791f}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.75 "Hiragino Mincho ProN","Noto Serif JP",-apple-system,"Hiragino Sans",serif;padding:24px 16px 56px}
.wrap{max-width:680px;margin:0 auto}.sans{font-family:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
header{margin-bottom:22px}.eyebrow{color:var(--mute);font-size:13px;letter-spacing:.14em}h1{font-size:34px;line-height:1.3;margin:2px 0 8px;letter-spacing:-.01em}
.chip{display:inline-block;padding:2px 12px;border-radius:999px;font-size:13px;margin-right:6px}.chip.ok{background:#e6f4ea;color:var(--ok)}.chip.warn{background:#fdebd2;color:var(--warn)}.chip.bad{background:#fde2e2;color:var(--bad)}
.summary{color:#4a3f33}.mini{margin:18px 0 6px}
.alerts{border-left:4px solid var(--warn);background:#fff;padding:12px 16px;margin:16px 0;border-radius:0 12px 12px 0}.alerts.bad{border-color:var(--bad)}
.feed{margin-top:26px;border-left:2px solid var(--line);padding-left:22px}
.day{position:relative;margin-bottom:26px}.day:before{content:"";position:absolute;left:-30px;top:8px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.day .date{color:var(--mute);font-size:13px}.day h3{font-size:19px;line-height:1.5;margin:0 0 4px}
.day .tags span{display:inline-block;background:#f3eadb;border-radius:8px;padding:0 10px;margin:2px 6px 2px 0;font-size:14px}
details{margin-top:6px}summary{cursor:pointer;color:var(--accent);font-size:14px}.why{margin:6px 0 0 1.1em;color:#5b4f42;font-size:15px}
.up{color:var(--ok)}.down{color:var(--bad)}
.mock-switch{font-size:12px;color:var(--mute);margin-bottom:12px}.mock-switch a{margin:0 6px;color:var(--accent)}.mock-switch a.on{font-weight:700;color:var(--ink)}
</style></head><body><div class="wrap sans"><div id="sw"></div>
<header><div class="eyebrow">AI 売買の日記</div><h1 id="h1"></h1><div id="chips"></div><p class="summary" id="sum"></p></header>
<div id="alerts"></div><div class="mini" id="chart"></div><div class="feed" id="feed"></div></div>
<script src="common.js"></script><script>
$("sw").innerHTML=stateSwitcher();
$("h1").innerHTML=`資産は <span>${money(BASE.equity)}</span><br><span style="font-size:20px;color:var(--mute)">はじめの ${money(BASE.start)} から ${money(BASE.equity-BASE.start,true)}</span>`;
$("chips").innerHTML=`<span class="chip ${S.level}">${S.word}</span><span class="chip" style="background:#f3eadb;color:#7a5a1e">${BASE.sessions} / ${BASE.needSessions} 営業日</span>`;
$("sum").textContent=S.sentence+S.detail+" まだ日数が少なく、損益だけで良し悪しは言えません。";
$("alerts").innerHTML=S.alerts.length?`<div class="alerts ${S.level==="bad"?"bad":""}"><b>気になること</b><br>${S.alerts.join("<br>")}</div>`:"";
$("chart").innerHTML=chart(EQUITY,{h:110,stroke:"#b7791f",fill:"rgba(183,121,31,.10)"});
const stories=[
 {d:"8月14日（金）",h:"2銘柄を買い、<span class='up'>+$10.33</span>。",tags:["買い TSLA","買い PANW","損切り 0"],why:["PLTR・AMD は「買う量が小さすぎる」ため見送り","NVDA は AI が買いと判断したが、保有の上限に近いため見送り","AVGO は見解が割れたため、買う量を2割減らした"]},
 {d:"8月13日（木）",h:"3銘柄を買い、<span class='down'>−$5.95</span>。落ち込みは今期最大の 1.12%。",tags:["買い 3件"],why:["市場全体が弱く、買った銘柄の多くが下がった（市場の影響が大きい日）"]},
 {d:"8月12日（水）",h:"5銘柄を買い、<span class='down'>−$1.37</span>。",tags:["買い 5件"],why:["候補10件のうち、AIが買いとした5件を購入"]},
 {d:"8月11日（火）",h:"運用開始。5銘柄を買い、<span class='down'>−$0.16</span>。",tags:["買い 5件","保護ストップ 5本"],why:["買うと同時に、損失を限る注文（保護ストップ）を全銘柄に置いた"]}];
$("feed").innerHTML=stories.map(s=>`<div class="day"><div class="date">${s.d}</div><h3>${s.h}</h3><div class="tags">${s.tags.map(t=>`<span>${t}</span>`).join("")}</div><details><summary>AIの考え・理由</summary><ul class="why">${s.why.map(w=>`<li>${w}</li>`).join("")}</ul></details></div>`).join("");
</script></body></html>
